[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-growth-engine"
version = "0.2.0"
description = "Policy-compliant content intelligence CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "AI Content Growth Engine contributors" }]
dependencies = [
  "google-api-python-client>=2.140,<3",
  "google-auth>=2.30,<3",
  "google-auth-oauthlib>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.9",
]

[project.scripts]
growth-engine = "growth_engine.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
